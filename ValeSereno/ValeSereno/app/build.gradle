plugins {
    id 'com.android.application'
}

android {
    namespace 'com.valesereno.prototipo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.valesereno.prototipo'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assina com a chave de debug para facilitar o teste em celulares.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'woff2'
    }
}
